<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Santili · Gestão de atendimentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c1b3a; --pine:#4b3fc4; --pine-d:#3a2fa0; --mint:#7b6ef0; --sage:#b6adf2;
  --coral:#3b82f6; --coral-d:#2563eb; --sand:#f2f1fb; --paper:#ffffff; --line:#e4e1f2;
  --muted:#6b6a86; --ok:#2f8f6b; --warn:#c9852b; --err:#c0503c; --shadow:0 6px 24px rgba(28,27,58,.09);
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--sand);color:var(--ink);font-size:15px;line-height:1.5}
h1,h2,h3,.display{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:14px}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--pine)}
.hidden{display:none!important}

/* ---------- Auth ---------- */
.auth-wrap{min-height:100%;display:grid;place-items:center;padding:24px;
  background:radial-gradient(120% 120% at 0% 0%, #4b3fc4 0%, #1c1b3a 60%, #14122e 100%)}
.auth-card{width:100%;max-width:420px;background:var(--paper);border-radius:20px;padding:34px 30px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:24px}
.brand .mark{width:38px;height:38px;border-radius:11px;background:var(--pine);display:grid;place-items:center;color:#fff}
.brand b{font-family:'Bricolage Grotesque';font-size:20px;font-weight:800;letter-spacing:-.02em}
.brand span{font-size:12px;color:var(--muted);display:block;line-height:1;margin-top:2px}
.auth-card h2{font-size:22px;margin-bottom:4px}
.auth-card .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--pine-d);margin-bottom:6px}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:5px}
.inp{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:#fbfaff;transition:.15s}
.inp:focus{outline:none;border-color:var(--mint);background:#fff;box-shadow:0 0 0 3px rgba(123,110,240,.2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:10px;font-weight:600;transition:.15s}
.btn-primary{background:var(--pine);color:#fff}
.btn-primary:hover{background:var(--pine-d)}
.btn-coral{background:var(--coral);color:#fff}
.btn-coral:hover{background:var(--coral-d)}
.btn-ghost{background:#eeecfb;color:var(--pine-d)}
.btn-ghost:hover{background:#e2ebe8}
.btn-danger{background:#fbeae6;color:var(--err)}
.btn-danger:hover{background:#f6d9d2}
.btn-block{width:100%}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{font-size:13px;padding:9px 12px;border-radius:9px;margin-bottom:12px}
.msg.err{background:#fbeae6;color:var(--err)}
.msg.ok{background:#e4f3ec;color:var(--ok)}
.msg.info{background:#eaf1f5;color:#2b6b86}
.link-row{text-align:center;margin-top:16px;font-size:13px;color:var(--muted)}
.link-row button{color:var(--pine);font-weight:600}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:246px 1fr;min-height:100vh}
.side{background:var(--pine);color:#e7e4fa;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side .brand{padding:20px 20px 14px;margin:0}
.side .brand b{color:#fff}.side .brand span{color:#b6adf2}
.side .brand .mark{background:#5347b8}
.nav{padding:6px 12px;flex:1;overflow:auto}
.nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#9a91e0;padding:14px 12px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#d8d3f5;font-size:14px;font-weight:500;cursor:pointer;transition:.12s;margin-bottom:2px}
.nav a:hover{background:#5a4fc4;color:#fff}
.nav a.active{background:#fff;color:var(--pine-d);font-weight:600}
.nav a.active svg{stroke:var(--pine)}
.nav a svg{width:18px;height:18px;stroke:#b6adf2;flex-shrink:0}
.nav a:hover svg{stroke:#fff}
.side-foot{padding:12px;border-top:1px solid #5347b8}
.side-foot .who{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex-shrink:0}
.who .n{font-size:13px;font-weight:600;color:#fff;line-height:1.2}
.who .r{font-size:11px;color:#b6adf2}
.side-foot .btn{width:100%;margin-top:8px;background:#5347b8;color:#e7e4fa}
.side-foot .btn:hover{background:#6156c4}

.main{padding:28px 34px;max-width:1120px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:16px;flex-wrap:wrap}
.pagehead h1{font-size:26px;font-weight:700}
.pagehead .greet{font-size:13px;color:var(--muted);margin-top:2px}

/* cards / grid */
.grid{display:grid;gap:16px}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card h3{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.stat .k{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-family:'Bricolage Grotesque';font-size:38px;font-weight:800;line-height:1;margin-top:8px;color:var(--pine-d)}
.stat .sub{font-size:12.5px;color:var(--muted);margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px}
.pill.on{background:#e4f3ec;color:var(--ok)}
.pill.off{background:#fbeae6;color:var(--err)}
.pill.gray{background:#eeecfb;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}

/* tables */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:9px 10px;border-bottom:2px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid #efedf8;font-size:14px;vertical-align:middle}
tr:last-child td{border-bottom:none}
.tbl-actions{display:flex;gap:6px;justify-content:flex-end}
.icon-btn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:#eeecfb}
.icon-btn:hover{background:#e2def5}
.icon-btn svg{width:16px;height:16px;stroke:var(--pine-d)}
.icon-btn.danger{background:#fbeae6}.icon-btn.danger svg{stroke:var(--err)}

/* search */
.search-box{position:relative;max-width:560px}
.search-box .inp{padding-left:42px;font-size:15px;padding-top:13px;padding-bottom:13px}
.search-box .si{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted)}
.search-actions{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;gap:6px}
.res-list{margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.res-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #efedf8;cursor:pointer}
.res-item:last-child{border-bottom:none}
.res-item:hover{background:#f5f3fd}
.res-item .nm{font-weight:600}.res-item .ph{font-size:12.5px;color:var(--muted)}
.res-empty{padding:18px 14px;color:var(--muted);font-size:13.5px;display:flex;align-items:center;justify-content:space-between;gap:12px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(28,27,58,.5);display:grid;place-items:center;padding:24px;z-index:50}
.modal{background:var(--paper);border-radius:18px;width:100%;max-width:640px;max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.modal.lg{max-width:760px}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.modal-head h2{font-size:19px}
.modal-body{padding:22px 24px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:#fff}
.close-x{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:#efedf8}
.close-x:hover{background:#e2def5}

/* tabs */
.tabs{display:flex;gap:4px;background:#efedf8;padding:4px;border-radius:11px;margin-bottom:18px}
.tabs button{flex:1;padding:9px;border-radius:8px;font-weight:600;color:var(--muted);font-size:13px}
.tabs button.active{background:#fff;color:var(--pine-d);box-shadow:0 1px 4px rgba(0,0,0,.06)}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.check{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;cursor:pointer;background:#fbfaff}
.check input{width:18px;height:18px;accent-color:var(--pine)}
.check .t{font-weight:600;font-size:13.5px}.check .d{font-size:12px;color:var(--muted)}

/* chips (services) */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:20px;background:#eeecfb;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid transparent}
.chip:hover{background:#e2ebe8}
.chip.sel{background:var(--pine);color:#fff}
.chip.add{background:#fff;border:1.5px dashed var(--sage);color:var(--pine)}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head .lbl{font-weight:600;font-size:13.5px}
.cal-nav{display:flex;gap:6px;align-items:center}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1.5px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer;background:#fbfaff;transition:.12s}
.day:hover{border-color:var(--mint);background:#fff}
.day.sel{background:var(--pine);color:#fff;border-color:var(--pine)}
.day.today{border-color:var(--coral)}
.day.off{opacity:.4;cursor:not-allowed}
.day .dn{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;opacity:.7}
.day .dd{font-family:'Bricolage Grotesque';font-size:18px;font-weight:700;margin-top:2px}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.month .mh{font-size:10px;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0}
.month .md{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:13px;cursor:pointer;background:#fbfaff}
.month .md:hover{border-color:var(--mint)}
.month .md.sel{background:var(--pine);color:#fff}
.month .md.today{border-color:var(--coral)}
.month .md.blank{border:none;background:none;cursor:default}
.sched-line{display:flex;align-items:center;gap:10px;margin-top:12px;padding:12px;background:#f5f3fd;border-radius:11px}
.sched-line .t{font-weight:600;font-size:14px}

/* history */
.hist{display:flex;flex-direction:column;gap:8px}
.hist-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:11px}
.hist-item .d{width:44px;height:44px;border-radius:10px;background:#eeecfb;display:grid;place-items:center;flex-shrink:0}
.hist-item .d .dd{font-family:'Bricolage Grotesque';font-weight:800;font-size:16px;color:var(--pine-d);line-height:1}
.hist-item .d .mm{font-size:9px;text-transform:uppercase;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:28px 12px;font-size:13.5px}
.empty svg{width:34px;height:34px;stroke:var(--sage);margin-bottom:8px}

/* gestão schedule */
.gday{display:grid;grid-template-columns:130px 1fr;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #efedf8}
.gday:last-child{border-bottom:none}
.gday .name{font-weight:600;display:flex;align-items:center;gap:9px}
.time-in{width:100px}
.tog{position:relative;width:42px;height:24px;background:#d0cbe8;border-radius:20px;transition:.15s;flex-shrink:0}
.tog.on{background:var(--pine)}
.tog::after{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.15s}
.tog.on::after{left:21px}
.gslots{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px}
.gslots .lb{color:var(--muted);font-size:12px}

/* templates */
.tpl{border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:12px;background:#fff}
.tpl-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.tpl-top .nm{font-weight:700;font-size:15px}
.tpl-trigger{font-size:12px;color:var(--pine-d);background:#eeecfb;padding:3px 9px;border-radius:6px;font-weight:600;display:inline-block;margin-bottom:8px}
.tpl-preview{background:#f0eefb;border-left:3px solid var(--mint);padding:11px 13px;border-radius:0 8px 8px 0;font-size:13.5px;white-space:pre-wrap;color:#33306b}
.ph-help{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ph-tag{font-size:11.5px;background:#eeecfb;color:var(--coral-d);padding:3px 8px;border-radius:6px;cursor:pointer;font-weight:600;border:1px solid #d0cbe8}

/* csv */
.drop{border:2px dashed var(--sage);border-radius:14px;padding:26px;text-align:center;background:#fbfaff;cursor:pointer}
.drop:hover{background:#f2effc;border-color:var(--mint)}
.drop svg{width:32px;height:32px;stroke:var(--pine);margin-bottom:8px}
.drop b{font-size:14.5px}.drop span{display:block;font-size:12.5px;color:var(--muted);margin-top:4px}
.report{margin-top:14px}
.report .rl{display:flex;justify-content:space-between;padding:8px 12px;border-radius:8px;font-size:13.5px;margin-bottom:6px}
.report .rl.ok{background:#e4f3ec;color:var(--ok)}
.report .rl.skip{background:#fdf3e5;color:var(--warn)}
.rejected{margin-top:8px;font-size:12.5px;color:var(--muted);max-height:140px;overflow:auto}
.rejected div{padding:4px 0;border-bottom:1px dashed #eee}

.banner{background:#fff8ef;border:1px solid #f0dfc4;border-radius:12px;padding:12px 16px;font-size:13px;color:#8a6a2f;display:flex;gap:10px;align-items:flex-start;margin-bottom:18px}
.banner svg{width:18px;height:18px;stroke:#c9852b;flex-shrink:0;margin-top:1px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:11px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:100;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;bottom:34px}

@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:.2s;width:246px}
  .side.open{transform:none}
  .main{padding:18px}
  .grid-3,.grid-2,.row2{grid-template-columns:1fr}
  .mobile-bar{display:flex!important}
}
.mobile-bar{display:none;align-items:center;gap:12px;margin-bottom:14px}
.mobile-bar button{width:40px;height:40px;border-radius:10px;background:var(--pine);display:grid;place-items:center}
.mobile-bar svg{stroke:#fff;width:20px;height:20px}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast"></div>

<script>
/* ============================================================
   Santili — gestão de atendimentos (MVP · podóloga Nataly Rodrigues)
   HTML único. Persistência via window.storage (Claude) com
   fallback em memória. WhatsApp via módulo WhAPI (modo simulação).
   ============================================================ */

/* ---------- ícones ---------- */
const I = {
  logo:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M8 3v9a4 4 0 0 0 8 0V3"/><path d="M6 21h12"/></svg>',
  summary:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>',
  atend:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>',
  gestao:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  crm:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
  refresh:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>',
  upload:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5M12 3v12"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="#5a5248" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.3 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.3a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
  menu:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>',
  logout:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>',

/* DDDs válidos no Brasil */
const DDD=new Set(['11','12','13','14','15','16','17','18','19','21','22','24','27','28','31','32','33','34','35','37','38','41','42','43','44','45','46','47','48','49','51','53','54','55','61','62','63','64','65','66','67','68','69','71','73','74','75','77','79','81','82','83','84','85','86','87','88','89','91','92','93','94','95','96','97','98','99']);
const DDD_PADRAO='79'; // Aracaju/SE

/* normaliza telefone: 9 díg -> +79 ; 10/11 díg -> DDD já incluso */
function normPhone(raw){
  let d=String(raw||'').replace(/\D/g,'');
  if(d.length===9) return DDD_PADRAO+d;                 // sem DDD -> Sergipe
  if(d.length===10||d.length===11) return d;            // com DDD
  if(d.length>11) return d.slice(0,11);
  return d;
}
function phoneValid(raw){ const d=normPhone(raw); return d.length>=10 && d.length<=11 && DDD.has(d.slice(0,2)); }
function fmtPhone(d){ d=String(d||'').replace(/\D/g,''); if(d.length===11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
  if(d.length===10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`; return d; }

/* filtro de nomes impróprios */
const BADWORDS=['merda','porra','caralho','buceta','bosta','cu','cuzao','viado','viadinho','puta','putinha','puto','fdp','arrombado','corno','otario','babaca','desgraca','desgraça','vagabunda','vagabundo','piroca','xoxota','pinto','pau no cu','vsf','pqp','krl','filha da puta','filho da puta','escroto','imbecil','idiota','retardado','bicha','xereca','rola','punheta','gozar','peido','cacete','pentelho','safado','safada'];
function nameIssue(name){
  const n=(name||'').trim();
  if(!n) return 'nome vazio';
  const norm=n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  for(const w of BADWORDS){ const re=new RegExp('(^|[^a-z])'+w.replace(/ /g,'[ ]?').replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-z]|$)'); if(re.test(norm)) return 'linguagem imprópria'; }
  if(/^\d+$/.test(n)) return 'nome numérico';
  if(n.length<2) return 'nome muito curto';
  return null;
}
function firstName(n){ return (n||'').trim().split(/\s+/)[0]||''; }

/* ============================================================
   MÓDULO WhAPI  (whapi.cloud) — isolado
   Em produção, token e envio devem rodar no servidor.
   Aqui: modo simulação (config.simulate) para não vazar token
   nem quebrar no preview. Troque para false quando plugar backend.
   ============================================================ */
const WhAPI={
  async send(to,text){
    const cfg=DB.config;
    // 1) proxy no servidor (recomendado): o token nunca chega ao navegador
    if(cfg.proxyUrl){
      try{
        const r=await fetch(cfg.proxyUrl,{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({to:to.replace(/\D/g,''),body:text})});
        return {ok:r.ok,status:r.status,viaProxy:true};
      }catch(e){ return {ok:false,error:String(e)}; }
    }
    // 2) simulação: nada é enviado de verdade
    if(cfg.simulate || !cfg.whapiToken){
      console.log('[WhAPI simulado] para',to,'\n',text);
      return {ok:true,simulated:true};
    }
    // 3) chamada direta (apenas testes; expõe o token no navegador)
    try{
      const r=await fetch('https://gate.whapi.cloud/messages/text',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.whapiToken},
        body:JSON.stringify({to:to.replace(/\D/g,''),body:text})
      });
      return {ok:r.ok,status:r.status};
    }catch(e){ return {ok:false,error:String(e)}; }
  },
  // checa se o canal WhAPI está conectado
  async health(){
    const cfg=DB.config;
    if(cfg.proxyUrl){
      try{ const r=await fetch(cfg.proxyUrl,{method:'GET'}); return {ok:r.ok,status:r.status,viaProxy:true}; }
      catch(e){ return {ok:false,error:String(e)}; }
    }
    if(cfg.simulate||!cfg.whapiToken) return {ok:true,simulated:true};
    try{
      const r=await fetch('https://gate.whapi.cloud/health?wakeup=true',{headers:{'Authorization':'Bearer '+cfg.whapiToken}});
      const j=await r.json().catch(()=>({}));
      return {ok:r.ok,status:r.status,text:(j&&j.status&&(j.status.text||j.status.code||''))||''};
    }catch(e){ return {ok:false,error:String(e)}; }
  },
  // gera e "envia" código de validação para o número do gestor
  async sendCode(number){
    const code=(''+Math.floor(100000+Math.random()*900000));
    await this.send(number,`Santili · código de validação: ${code}. Válido por 10 min.`);
    return code;
  }
};

/* CSV parse simples (; ou ,) */
function parseCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) return [];
  const sep=(lines[0].match(/;/g)||[]).length>=(lines[0].match(/,/g)||[]).length?';':',';
  let header=lines[0].split(sep).map(h=>h.trim().toLowerCase());
  let hasHeader=header.some(h=>['nome','name','telefone','fone','celular','contato','whatsapp'].includes(h));
  let rows=hasHeader?lines.slice(1):lines;
  const idxNome=hasHeader?header.findIndex(h=>['nome','name'].includes(h)):0;
  const idxFone=hasHeader?header.findIndex(h=>['telefone','fone','celular','contato','whatsapp'].includes(h)):1;
  const idxData=hasHeader?header.findIndex(h=>h.includes('ultimo')||h.includes('atend')||h.includes('data')):2;
  return rows.map(l=>{const p=l.split(sep);return{
    nome:(p[idxNome]||'').trim(),
    fone:(p[idxFone>=0?idxFone:1]||'').trim(),
    data:(idxData>=0?(p[idxData]||'').trim():'')
  };});
}
async function handleCSV(f){
  const text=await f.text();
  const rows=parseCSV(text);
  const isAdmin=SESSION.role==='admin';
  let added=0,skipped=[],dup=0;
  const seen=new Set(DB.clients.map(c=>c.phone));
  rows.forEach(r=>{
    const issue=nameIssue(r.nome);
    if(!phoneValid(r.fone)){ skipped.push({nome:r.nome,motivo:'telefone inválido'}); return; }
    const phone=normPhone(r.fone);
    if(issue && !isAdmin){ skipped.push({nome:r.nome,motivo:issue}); return; }
    if(seen.has(phone)){ dup++; return; }
    seen.add(phone);
    DB.clients.push({id:uid(),firstName:firstName(r.nome),lastName:'',phone,optIn:true,
      lastService:r.data||'',services:[],appointments:[],flagged:!!issue,createdAt:Date.now()});
    added++;
  });
  await saveDB();
  const rep=document.getElementById('csvReport');
  rep.innerHTML=`<div class="report">
    <div class="rl ok"><span>Clientes cadastrados</span><b>${added}</b></div>
    ${dup?`<div class="rl skip"><span>Ignorados (já existiam)</span><b>${dup}</b></div>`:''}
    ${skipped.length?`<div class="rl skip"><span>Não cadastrados (nome/telefone inválido)</span><b>${skipped.length}</b></div>
      <div class="rejected">${skipped.map(s=>`<div>• <b>${esc(s.nome||'(vazio)')}</b> — ${s.motivo}</div>`).join('')}</div>`:''}
  </div>`;
  toast(added+' cliente(s) adicionado(s)');
  // atualiza os KPIs sem sair da tela
  const kpi=document.querySelector('.stat .v'); if(kpi)kpi.textContent=DB.clients.length;
}

let clientTab='dados', calWeek=0, calExpanded=false, selDate=null, selTime='';
function openClientModal(client, opts={}){
  const isNew=!client;
  clientTab='dados'; calWeek=0; calExpanded=false; selDate=null; selTime='';
  const seed=opts.seed||'';
  const draft=client?JSON.parse(JSON.stringify(client)):{
    id:null,firstName:opts.byPhone?'':seed,lastName:'',phone:opts.byPhone?normPhone(seed):'',
    optIn:true,lastService:'',services:[],appointments:[],flagged:false
  };
  const isAdmin=SESSION.role==='admin';

  const ov=document.createElement('div'); ov.className='overlay'; ov.id='clientOverlay';
  ov.innerHTML=`<div class="modal lg"><div class="modal-head">
    <h2>${isNew?'Novo cliente':esc(draft.firstName+' '+(draft.lastName||''))}</h2>
    <button class="close-x" id="cx">${I.x}</button></div>
    <div class="modal-body">
      <div class="tabs">
        <button data-t="dados" class="active">Dados</button>
        <button data-t="servico">Serviço &amp; agenda</button>

      </div>

      <div style="flex:1"></div>
      <button class="btn btn-ghost" id="cancel">Cancelar</button>
      <button class="btn btn-primary" id="save">${isNew?'Cadastrar':'Salvar'}</button>
    </div></div>`;
  document.body.appendChild(ov);
  ov.onclick=e=>{if(e.target===ov)closeClientModal();};
  document.getElementById('cx').onclick=closeClientModal;
  document.getElementById('cancel').onclick=closeClientModal;

  const dc=document.getElementById('delClient');
  if(dc)dc.onclick=async()=>{ if(!confirm('Excluir este cliente? Ação não pode ser desfeita.'))return;
    DB.clients=DB.clients.filter(c=>c.id!==draft.id); await saveDB(); closeClientModal(); renderApp(); toast('Cliente excluído'); };

  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
    clientTab=b.dataset.t; document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b)); renderClientTab(draft,isNew,isAdmin);

async function addServiceFromInput(draft){
  const inp=document.getElementById('svcSearch'); const name=inp.value.trim();
  if(!name)return;
  if(!DB.services.some(s=>s.toLowerCase()===name.toLowerCase())){ DB.services.push(name); await saveDB(); }
  if(!draft.services.includes(name))draft.services.push(name);
  inp.value=''; renderServiceChips(draft); toast('Serviço adicionado');
}

/* calendário: semana atual + navegação + ampliar (mês) */
function startOfWeek(d){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x; }
function scheduleDayEnabled(date){
  const keys=['dom','seg','ter','qua','qui','sex','sab'];
  const cfg=DB.schedule[keys[date.getDay()]]; return cfg&&cfg.enabled;
}
function renderCalendar(draft){
  const base=startOfWeek(new Date()); base.setDate(base.getDate()+calWeek*7);
  const lbl=document.getElementById('calLbl');
  const names=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  const today=new Date(); today.setHours(0,0,0,0);
  const body=document.getElementById('calBody');
  if(!calExpanded){
    lbl.textContent=base.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})+' – '+new Date(base.getFullYear(),base.getMonth(),base.getDate()+6).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});
    let html='<div class="week">';
    for(let i=0;i<7;i++){ const d=new Date(base); d.setDate(base.getDate()+i);
      const isToday=d.getTime()===today.getTime();
      const off=!scheduleDayEnabled(d);
      const sel=selDate&&d.toDateString()===selDate;
      html+=`<div class="day ${sel?'sel':''} ${isToday?'today':''} ${off?'off':''}" data-d="${d.toISOString()}">
        <div class="dn">${names[i]}</div><div class="dd">${d.getDate()}</div></div>`; }
    html+='</div>'; body.innerHTML=html;
  }else{
    const mBase=new Date(base.getFullYear(),base.getMonth(),1);
    lbl.textContent=mBase.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
    const first=(mBase.getDay()+6)%7; const dim=new Date(mBase.getFullYear(),mBase.getMonth()+1,0).getDate();
    let html='<div class="month">'+names.map(n=>`<div class="mh">${n}</div>`).join('');
    for(let i=0;i<first;i++)html+='<div class="md blank"></div>';
    for(let dd=1;dd<=dim;dd++){ const d=new Date(mBase.getFullYear(),mBase.getMonth(),dd);
      const isToday=d.getTime()===today.getTime(); const sel=selDate&&d.toDateString()===selDate;
      html+=`<div class="md ${sel?'sel':''} ${isToday?'today':''}" data-d="${d.toISOString()}">${dd}</div>`; }
    html+='</div>'; body.innerHTML=html;
    // navegação por mês quando ampliado
    document.getElementById('calPrev').onclick=()=>{calWeek-=4;renderCalendar(draft);};
    document.getElementById('calNext').onclick=()=>{calWeek+=4;renderCalendar(draft);};
  }
  body.querySelectorAll('[data-d]').forEach(el=>{ if(el.classList.contains('off'))return;
    el.onclick=()=>{ selDate=new Date(el.dataset.d).toDateString();
      const now=new Date(); selTime=selTime||`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      renderCalendar(draft); renderSchedLine(draft); };
  });
  renderSchedLine(draft);
}
function renderSchedLine(draft){
  const el=document.getElementById('schedLine'); if(!el)return;
  if(!selDate){ el.innerHTML=''; return; }
  const d=new Date(selDate);
  el.innerHTML=`<div class="sched-line">
    <span class="t">${d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'})}</span>
    <input id="apTime" class="inp time-in" type="time" value="${selTime}">
    <select id="apSvc" class="inp" style="flex:1">
      <option value="">Serviço (opcional)</option>
      ${DB.services.map(s=>`<option ${draft.services.includes(s)?'selected':''}>${esc(s)}</option>`).join('')}
    </select>
    <button class="btn btn-coral btn-sm" id="apAdd">Agendar</button></div>`;
  document.getElementById('apTime').onchange=e=>selTime=e.target.value;
  document.getElementById('apAdd').onclick=()=>{
    const time=document.getElementById('apTime').value;
    const svc=document.getElementById('apSvc').value;
    const dt=new Date(selDate); const[h,m]=(time||'00:00').split(':'); dt.setHours(+h,+m,0,0);
    draft.appointments=draft.appointments||[];
    draft.appointments.push({id:uid(),datetime:dt.toISOString(),time,service:svc});
    draft.lastService=dt.toLocaleDateString('pt-BR')+(time?' '+time:'');
    toast('Agendamento adicionado — salve para confirmar');
    selDate=null; renderCalendar(draft);
    // reflete no histórico se estiver aberto
  };
}

async function saveClient(draft,isNew,isAdmin){
  const first=(document.getElementById('f_first')?.value||draft.firstName||'').trim();
  const lastN=(document.getElementById('f_last')?.value||draft.lastName||'').trim();
  const phoneRaw=(document.getElementById('f_phone')?.dataset.raw)||(document.getElementById('f_phone')?.value)||draft.phone;
  const opt=document.getElementById('f_opt')?document.getElementById('f_opt').checked:draft.optIn;
  const lastServ=(document.getElementById('f_last_serv')?.value||draft.lastService||'').trim();

  if(clientTab!=='dados'){ /* mantém valores do draft se salvou de outra aba */ }
  if(!first) { switchToDados(); return toastErr('Informe o primeiro nome.'); }
  const issue=nameIssue(first);
  if(issue && !isAdmin){ switchToDados(); return toastErr('Nome impróprio — apenas admin pode cadastrar.'); }
  if(!phoneValid(phoneRaw)){ switchToDados(); return toastErr('Telefone inválido.'); }
  const phone=normPhone(phoneRaw);
  const dupe=DB.clients.find(c=>c.phone===phone && c.id!==draft.id);
  if(dupe){ switchToDados(); return toastErr('Já existe cliente com esse telefone: '+dupe.firstName); }

  draft.firstName=first; draft.lastName=lastN; draft.phone=phone; draft.optIn=opt;
  draft.lastService=lastServ; draft.flagged=!!issue;

  if(isNew){ draft.id=uid(); draft.createdAt=Date.now(); DB.clients.push(draft); }
  else{ const i=DB.clients.findIndex(c=>c.id===draft.id); if(i>=0)DB.clients[i]=draft; }
  await saveDB(); closeClientModal(); toast(isNew?'Cliente cadastrado':'Cadastro atualizado');
  if(ROUTE==='atendimento')doSearch();
}
function switchToDados(){ clientTab='dados'; document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.t==='dados'));
  const d=document.querySelector('.overlay'); }
function toastErr(m){ toast('⚠ '+m); }

    ${days.map(([k,label])=>{const c=DB.schedule[k];return`
    <div class="gday">
      <div class="name"><span class="tog ${c.enabled?'on':''}" data-tog="${k}"></span>${label}</div>
      <div class="gslots" data-day="${k}" ${c.enabled?'':'style="opacity:.4;pointer-events:none"'}>

      </div>
    </div>`;}).join('')}
    <div style="margin-top:18px;text-align:right"><button class="btn btn-primary" id="saveSched">Salvar agenda</button></div>
  </div>`;

  v.querySelectorAll('[data-tog]').forEach(t=>t.onclick=()=>{
    const k=t.dataset.tog; DB.schedule[k].enabled=!DB.schedule[k].enabled; viewGestao(v);
  });

    </div>
    <div class="modal-foot"><button class="btn btn-ghost" id="tcancel">Cancelar</button>
      <button class="btn btn-ghost" id="ttest">${I.send} Testar envio</button>
      <button class="btn btn-primary" id="tsave">${isNew?'Criar':'Salvar'}</button></div></div>`;
  document.body.appendChild(ov);
  ov.onclick=e=>{if(e.target===ov)ov.remove();};
  const close=()=>ov.remove();
  document.getElementById('tx').onclick=close; document.getElementById('tcancel').onclick=close;
  const msg=document.getElementById('t_msg'), prev=document.getElementById('t_prev');
  msg.oninput=()=>prev.textContent=previewMsg(msg.value);
  ov.querySelectorAll('[data-ph]').forEach(p=>p.onclick=()=>{
    const ph=p.dataset.ph; const s=msg.selectionStart||msg.value.length;
    msg.value=msg.value.slice(0,s)+ph+msg.value.slice(s); prev.textContent=previewMsg(msg.value); msg.focus();
  });
  document.getElementById('ttest').onclick=async()=>{
    const num=DB.config.activeNumber; if(!num)return toast('Configure o número ativo primeiro');
    const r=await WhAPI.send(num,previewMsg(msg.value));
    toast(r.simulated?'Envio simulado — veja o console':(r.ok?'Enviado via WhAPI':'Falha no envio'));
  };
  document.getElementById('tsave').onclick=async()=>{
    const name=document.getElementById('t_name').value.trim(); if(!name)return toast('Dê um nome ao template');
    d.name=name; d.trigger=document.getElementById('t_trig').value; d.message=msg.value; d.active=document.getElementById('t_active').checked;
    if(isNew){d.id=uid();DB.templates.push(d);}else{const i=DB.templates.findIndex(x=>x.id===d.id);DB.templates[i]=d;}
    await saveDB(); close(); renderTemplates(); toast('Template salvo');
  };
}

/* ============================================================
   CONEXÃO WHATSAPP / WhAPI (admin)
   ============================================================ */
function openWhatsAppModal(){
  const cfg=DB.config;
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML=`<div class="modal"><div class="modal-head"><h2>${I.wa} Conexão WhatsApp</h2><button class="close-x" id="wx">${I.x}</button></div>
    <div class="modal-body">
      <div class="banner">${I.warn}<div><b>Recomendado:</b> use um proxy no servidor (Cloudflare Worker / Netlify Function). Assim o token fica só no servidor e nunca aparece no navegador. O token direto abaixo é só para testes.</div></div>
      <div class="field"><label>URL do proxy (recomendado)</label>
        <input id="w_proxy" class="inp" value="${esc(cfg.proxyUrl||'')}" placeholder="https://seu-worker.workers.dev/send" autocomplete="off">
        <div class="hint">Endpoint que guarda o token no servidor e repassa para a WhAPI. Com proxy, o token abaixo é ignorado.</div></div>
      <div class="field"><label>Token da WhAPI (apenas testes)</label>
        <div style="display:flex;gap:8px">
          <input id="w_token" class="inp" type="password" value="${esc(cfg.whapiToken||'')}" placeholder="cole o token do canal WhAPI" style="flex:1" autocomplete="off">
          <button class="icon-btn" id="w_eye" title="Mostrar/ocultar">${I.search}</button>
        </div>
        <div class="hint">Fica salvo no navegador — use só sem proxy, para testar.</div></div>
      <div class="field"><label>Número ativo para disparo</label>
        <input id="w_num" class="inp" value="${cfg.activeNumber?fmtPhone(cfg.activeNumber):''}" placeholder="79 99999-9999" inputmode="numeric">
        <div class="hint">Número conectado ao canal WhAPI que enviará as mensagens.</div></div>
      <div class="check" style="margin-bottom:0"><input type="checkbox" id="w_sim" ${cfg.simulate?'checked':''}>
        <div><div class="t">Modo simulação</div><div class="d">Ligado: nada é enviado de verdade (vai para o console). Ignorado quando há proxy.</div></div></div>
      <div id="w_status" style="margin-top:14px"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="wcancel">Cancelar</button>
      <button class="btn btn-ghost" id="wtest">${I.send} Testar conexão</button>
      <button class="btn btn-primary" id="wsave">Salvar</button>
    </div></div>`;
  document.body.appendChild(ov);
  ov.onclick=e=>{if(e.target===ov)ov.remove();};
  const close=()=>ov.remove();
  document.getElementById('wx').onclick=close; document.getElementById('wcancel').onclick=close;
  document.getElementById('w_eye').onclick=()=>{const t=document.getElementById('w_token');t.type=t.type==='password'?'text':'password';};
  document.getElementById('wtest').onclick=async()=>{
    const st=document.getElementById('w_status');
    const prev={t:DB.config.whapiToken,s:DB.config.simulate,p:DB.config.proxyUrl};
    DB.config.proxyUrl=document.getElementById('w_proxy').value.trim();
    DB.config.whapiToken=document.getElementById('w_token').value.trim();
    DB.config.simulate=document.getElementById('w_sim').checked;
    st.innerHTML='<div class="msg info">Testando conexão…</div>';
    const r=await WhAPI.health();
    DB.config.whapiToken=prev.t; DB.config.simulate=prev.s; DB.config.proxyUrl=prev.p;
    if(r.viaProxy&&r.ok) st.innerHTML='<div class="msg ok">Proxy respondeu — token protegido no servidor.</div>';
    else if(r.simulated) st.innerHTML='<div class="msg info">Modo simulação ligado — informe proxy ou token para testar de verdade.</div>';
    else if(r.ok) st.innerHTML='<div class="msg ok">Canal conectado'+(r.text?': '+esc(r.text):'')+'.</div>';
    else st.innerHTML='<div class="msg err">Não conectou'+(r.status?' ('+r.status+')':'')+'. Neste preview, chamadas externas são bloqueadas — funciona quando hospedado.</div>';
  };
  document.getElementById('wsave').onclick=async()=>{
    const num=document.getElementById('w_num').value;
    if(num && !phoneValid(num)) return toast('Número inválido');
    DB.config.proxyUrl=document.getElementById('w_proxy').value.trim();
    DB.config.whapiToken=document.getElementById('w_token').value.trim();
    DB.config.activeNumber=num?normPhone(num):'';
    DB.config.simulate=document.getElementById('w_sim').checked;
    if(!DB.config.whapiToken && !DB.config.proxyUrl) DB.config.simulate=true; // sem credencial não sai da simulação
    await saveDB(); close(); renderApp(); toast('Conexão WhatsApp salva');
  };
}

/* ============================================================
   GESTOR DE USUÁRIOS (admin)
   ============================================================ */
function openUsersModal(){
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML=`<div class="modal"><div class="modal-head"><h2>Gestor de usuários</h2><button class="close-x" id="ux">${I.x}</button></div>
    <div class="modal-body">
      <table><thead><tr><th>Usuário</th><th>WhatsApp</th><th>Perfil</th><th></th></tr></thead>
      <tbody id="uBody"></tbody></table>
      <div style="margin-top:18px;border-top:1px solid var(--line);padding-top:16px">
        <h3 style="font-size:14px;margin-bottom:12px">Adicionar usuário</h3>
        <div class="row2">
          <div class="field"><label>Nome</label><input id="u_name" class="inp" placeholder="Nome"></div>
          <div class="field"><label>WhatsApp</label><input id="u_wa" class="inp" placeholder="79 99999-9999" inputmode="numeric"></div>
        </div>
        <div class="row2">
          <div class="field"><label>Senha</label><input id="u_pw" class="inp" type="password" placeholder="letras e números"></div>
          <div class="field"><label>Perfil</label><select id="u_role" class="inp">
            <option value="funcionario">Funcionário — só cadastra clientes</option>
            <option value="admin">Administrador — acesso total</option></select></div>
        </div>
        <button class="btn btn-primary" id="u_add">${I.plus} Adicionar</button>
      </div>
    </div></div>`;
  document.body.appendChild(ov);
  ov.onclick=e=>{if(e.target===ov)ov.remove();};
  document.getElementById('ux').onclick=()=>ov.remove();
  function drawUsers(){
    document.getElementById('uBody').innerHTML=DB.users.map(u=>`
      <tr><td><b>${esc(u.name)}</b></td><td>${fmtPhone(u.whatsapp)}</td>
      <td><span class="pill ${u.role==='admin'?'on':'gray'}"><span class="dot"></span>${u.role==='admin'?'Admin':'Funcionário'}</span></td>
      <td class="tbl-actions">${u.id!==SESSION.id?`<button class="icon-btn danger" data-del="${u.id}">${I.trash}</button>`:'<span style="font-size:11px;color:var(--muted)">você</span>'}</td></tr>`).join('');
    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
      if(!confirm('Remover este usuário?'))return;
      DB.users=DB.users.filter(x=>x.id!==b.dataset.del); await saveDB(); drawUsers();
    });
  }
  drawUsers();
  document.getElementById('u_add').onclick=async()=>{
    const name=document.getElementById('u_name').value.trim();
    const waRaw=document.getElementById('u_wa').value; const pw=document.getElementById('u_pw').value;
    const role=document.getElementById('u_role').value;
    if(!name)return toast('Informe o nome');
    if(!phoneValid(waRaw))return toast('WhatsApp inválido');
    if(pw.length<6||!/[a-zA-Z]/.test(pw)||!/[0-9]/.test(pw))return toast('Senha: 6+ com letras e números');
    const wa=normPhone(waRaw);
    if(DB.users.some(u=>u.whatsapp===wa))return toast('Já existe usuário com esse número');
    DB.users.push({id:uid(),name,whatsapp:wa,pass:await hashPass(pw),role,validated:false,createdAt:Date.now()});
    await saveDB(); drawUsers(); toast('Usuário adicionado');
    document.getElementById('u_name').value='';document.getElementById('u_wa').value='';document.getElementById('u_pw').value='';
  };
}

/* ============================================================
   BOOT
   ============================================================ */
(async function(){ await loadDB(); renderAuth(); })();
</script>
