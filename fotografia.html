<!doctype html>
<html lang="pt-BR" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />

    <title>Fotografia e Edição | Allisson Santiago</title>
    <meta name="description" content="Galeria de fotografia e edição de Allisson Santiago: registros de eventos, ensaios e retratos." />
    <meta name="theme-color" content="#8200db" />
    <link rel="canonical" href="https://www.allissonsantiago.com.br/fotografia" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Fotografia e Edição | Allisson Santiago" />
    <meta property="og:description" content="Galeria de fotografia e edição de Allisson Santiago: registros de eventos, ensaios e retratos." />
    <meta property="og:url" content="https://www.allissonsantiago.com.br/fotografia" />
    <meta property="og:image" content="https://www.allissonsantiago.com.br/assets/photo.png" />

    <link rel="icon" href="assets/icone.png?v=2" type="image/png" />

    <!-- Aplica o tema salvo antes da pintura, evitando o "flash" claro -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>

    <!-- Fonte: Segoe UI (a mesma do perfil no Instagram) com Open Sans como alternativa nos sistemas sem Segoe UI -->
    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link
      href="https://fonts.bunny.net/css2?family=Open+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- CSS do Tailwind, gerado com "npm run build" -->
    <link rel="stylesheet" href="assets/tailwind.css" />

    <!-- Design padrão do site -->
    <link rel="stylesheet" href="assets/site.css" />
    <link rel="stylesheet" href="assets/gallery.css" />
  </head>
  <body class="bg-white text-zinc-800 antialiased dark:bg-black dark:text-zinc-100">
    <div class="min-h-dvh min-w-80">
      <main id="page-content" class="mx-auto flex max-w-6xl flex-auto flex-col px-4 pb-4 lg:px-8 lg:pb-8">
        <header id="page-header" class="flex flex-none flex-wrap items-center justify-between gap-y-2 py-7">
          <div class="flex items-center gap-2">
            <a href="/" class="text-2xl font-light tracking-widest hover:text-purple-600 active:opacity-75 dark:hover:text-purple-400">
              Allisson Santiago
            </a>
            <button
              id="theme-toggle"
              type="button"
              aria-label="Alternar entre modo claro e escuro"
              aria-pressed="false"
              class="relative inline-flex size-9 items-center justify-center text-zinc-600 hover:opacity-75 dark:text-zinc-400"
            >
              <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5 dark:hidden"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/></svg>
              <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="hidden size-5 dark:block"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"/></svg>
            </button>
          </div>
          <nav aria-label="Principal" class="flex items-center gap-6">
            <a href="/#projects" class="text-sm font-medium decoration-purple-600 decoration-2 underline-offset-8 hover:text-black hover:underline dark:decoration-purple-400 dark:hover:text-white">Projetos</a>
            <a href="sobremim" class="text-sm font-medium decoration-purple-600 decoration-2 underline-offset-8 hover:text-black hover:underline dark:decoration-purple-400 dark:hover:text-white">Sobre mim</a>
            <a href="/#contact" class="text-sm font-medium decoration-purple-600 decoration-2 underline-offset-8 hover:text-black hover:underline dark:decoration-purple-400 dark:hover:text-white">Vamos conversar?</a>
          </nav>
        </header>

        <div class="grid grid-cols-1 gap-6 md:grid-cols-12">
          <section class="col-span-1 px-6 py-8 text-center md:col-span-12" aria-labelledby="foto-title">
            <h1 id="foto-title" class="text-4xl font-semibold text-zinc-500 dark:text-zinc-400/80">Registros e Edições</h1>
          </section>

          <section class="col-span-1 md:col-span-12" aria-label="Galeria de fotos">
            <div class="feed" data-feed>
              <figure class="shot shot--wide">
                <img src="assets/fotografia/foto-1.jpg" alt="Silhueta de um casal em frente ao pôr do sol, vista por entre colunas" width="1700" height="1200" draggable="false" fetchpriority="high" />
                <div class="shot-shield" aria-hidden="true"></div>
                <figcaption><strong>Casal</strong> | Sandra e Júnior</figcaption>
              </figure>
              <figure class="shot">
                <img src="assets/fotografia/foto-2.jpg" alt="Mesa de festa de chá de bebê com balões em tons de bege e dourado e um grande urso de pelúcia" width="1028" height="1400" draggable="false" loading="lazy" />
                <div class="shot-shield" aria-hidden="true"></div>
                <figcaption><strong>Chá revelação</strong> | João Guilherme</figcaption>
              </figure>
              <figure class="shot">
                <img src="assets/fotografia/foto-3.jpg" alt="Retrato em um deck de madeira sobre o rio, com um barco colorido ao fundo" width="1028" height="1400" draggable="false" loading="lazy" />
                <div class="shot-shield" aria-hidden="true"></div>
                <figcaption><strong>15 anos</strong> | Letícia</figcaption>
              </figure>
              <figure class="shot">
                <img src="assets/fotografia/foto-4.jpg" alt="Retrato sorridente com bola de vôlei na areia da praia" width="1028" height="1400" draggable="false" loading="lazy" />
                <div class="shot-shield" aria-hidden="true"></div>
                <figcaption><strong>15 anos</strong> | Letícia</figcaption>
              </figure>
            </div>
            <p class="mt-4 text-center text-xs text-zinc-500 dark:text-zinc-400/80">Imagens protegidas por direitos autorais.</p>
          </section>

          <footer class="flex flex-col gap-6 py-7 text-center text-sm md:col-span-12 md:flex-row-reverse md:justify-between md:gap-0 md:text-left">
            <nav aria-label="Redes sociais" class="flex items-center justify-center gap-4">
              <a href="https://instagram.com/allissonsantiago" target="_blank" rel="noopener noreferrer" aria-label="Instagram de Allisson Santiago" class="text-zinc-400 hover:text-[#405de6]">
                <svg aria-hidden="true" class="icon-instagram inline-block size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" > <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z" ></path> </svg>
              </a>
              <a href="https://www.linkedin.com/in/allisson-santiago/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn de Allisson Santiago" class="text-zinc-400 hover:text-[#0a66c2]">
                <svg aria-hidden="true" class="icon-linkedin inline-block size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" > <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" ></path> </svg>
              </a>
            </nav>
            <div class="text-zinc-500 dark:text-zinc-400/80">
              <span class="font-medium">Allisson Santiago</span> © <span id="year">2026</span>
            </div>
          </footer>
        </div>
      </main>
    </div>
    <button id="to-top" type="button" class="to-top" aria-label="Voltar ao topo"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" class="size-5"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 15.75 7.5-7.5 7.5 7.5"/></svg></button>
    <script src="assets/site.js"></script>
    <script src="assets/gallery.js"></script>
  </body>
</html>
